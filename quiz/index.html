<title>Distressed Explainers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --ink: #17202b;
    --ink-2: #4a5563;
    --ink-3: #7b8592;
    --line: #d5d9e0;
    --accent: #23407a;
    --accent-ink: #ffffff;
    --accent-soft: #e2e8f5;
    --good: #16704f;
    --good-soft: #dcefe6;
    --bad: #a8301f;
    --bad-soft: #f6e1dc;
    --warn: #8a5a00;
    --warn-soft: #f5e9cc;
    --shadow: 0 1px 2px rgba(23, 32, 43, 0.08), 0 4px 16px rgba(23, 32, 43, 0.06);
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161e;
      --surface: #182029;
      --surface-2: #212b37;
      --ink: #e8ecf1;
      --ink-2: #b4bcc7;
      --ink-3: #7f8a98;
      --line: #2e3947;
      --accent: #8fb0ee;
      --accent-ink: #0f1a2e;
      --accent-soft: #223252;
      --good: #6dcba0;
      --good-soft: #17352a;
      --bad: #f09080;
      --bad-soft: #3d1d17;
      --warn: #e6b85c;
      --warn-soft: #3b2f12;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161e;
    --surface: #182029;
    --surface-2: #212b37;
    --ink: #e8ecf1;
    --ink-2: #b4bcc7;
    --ink-3: #7f8a98;
    --line: #2e3947;
    --accent: #8fb0ee;
    --accent-ink: #0f1a2e;
    --accent-soft: #223252;
    --good: #6dcba0;
    --good-soft: #17352a;
    --bad: #f09080;
    --bad-soft: #3d1d17;
    --warn: #e6b85c;
    --warn-soft: #3b2f12;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
  h1 { font-size: 1.75rem; }
  h2 { font-size: 1.3rem; }
  h3 { font-size: 1.05rem; }
  p { margin: 0; }
  a { color: var(--accent); }
  button { font: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .muted { color: var(--ink-2); }
  .small { font-size: 0.9rem; }

  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { max-width: 880px; margin: 0 auto; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand .status { font-size: 0.8rem; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .brand .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .brand .status.on .dot { background: var(--good); }
  nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
  nav.tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 12px; color: var(--ink-2); cursor: pointer; white-space: nowrap; font-weight: 500;
  }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }

  main { padding-top: 24px; display: flex; flex-direction: column; gap: 24px; }
  section.view { display: flex; flex-direction: column; gap: 20px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .card.lift { box-shadow: var(--shadow); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.02em; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }

  .level { display: inline-flex; gap: 3px; align-items: center; }
  .level i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
  .level i.on { background: var(--accent); }

  /* Episode list */
  .episode { display: grid; gap: 12px; grid-template-columns: auto 1fr auto; align-items: center; }
  .episode .no { font-family: var(--serif); font-size: 1.6rem; color: var(--ink-3); width: 44px; text-align: center; }
  .episode .best { text-align: right; }
  @media (max-width: 560px) { .episode { grid-template-columns: auto 1fr; } .episode .best { grid-column: 2; text-align: left; } }

  /* Quiz */
  .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width 0.25s ease; }
  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
  .prompt { font-family: var(--serif); font-size: 1.2rem; line-height: 1.4; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
  .choice:hover { background: var(--surface-2); }
  .choice input { margin-top: 4px; accent-color: var(--accent); }
  .choice.correct { border-color: var(--good); background: var(--good-soft); }
  .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .choice .key { font-family: var(--mono); color: var(--ink-3); min-width: 1.2em; }
  input[type="text"], input[type="number"], select, textarea {
    font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; max-width: 100%;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .inline-input { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .inline-input input { max-width: 240px; }
  .order-list { display: flex; flex-direction: column; gap: 8px; }
  .order-item { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .order-item select { width: 72px; padding: 6px 8px; }
  .order-item.correct { border-color: var(--good); background: var(--good-soft); }
  .order-item.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .feedback { border-left: 3px solid var(--line); padding: 10px 14px; border-radius: 0 8px 8px 0; background: var(--surface-2); }
  .feedback.good { border-left-color: var(--good); }
  .feedback.bad { border-left-color: var(--bad); }
  .feedback .verdict { font-weight: 600; }
  .feedback.good .verdict { color: var(--good); }
  .feedback.bad .verdict { color: var(--bad); }

  /* Result */
  .score { font-family: var(--serif); font-size: 3rem; line-height: 1; }
  .concept-list { display: flex; flex-direction: column; gap: 6px; }
  .concept-line { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .table-wrap { overflow-x: auto; }

  /* Glossary */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters select { width: auto; }
  .filters input { flex: 1 1 200px; }
  .term { display: flex; flex-direction: column; gap: 6px; }
  .term .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .term .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 0.8rem; color: var(--ink-3); }

  /* Ladder */
  .ladder { display: flex; flex-direction: column; gap: 0; }
  .rung { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .rung:last-child { border-bottom: 0; }
  .rung .rail { position: relative; }
  .rung .rail::before { content: ""; position: absolute; left: 16px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  .rung .rail i { position: absolute; left: 10px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
  .rung.equity .rail i { background: var(--warn); }
  .rung dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 0.92rem; }
  .rung dt { color: var(--ink-3); }
  .rung dd { margin: 0; }
  @media (max-width: 560px) { .rung dl { grid-template-columns: 1fr; } .rung dt { margin-top: 6px; } }

  .notice { padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 0.92rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Distressed Explainers</h1>
      <span class="status" id="sync-status"><span class="dot"></span><span id="sync-text">Saving locally</span></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-quizzes" aria-selected="true" data-view="quizzes">Quizzes</button>
      <button role="tab" id="tab-progress" aria-selected="false" data-view="progress">Progress</button>
      <button role="tab" id="tab-glossary" aria-selected="false" data-view="glossary">Glossary</button>
      <button role="tab" id="tab-ladder" aria-selected="false" data-view="ladder">The ladder</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <main>
    <section class="view" id="view-quizzes" role="tabpanel" aria-labelledby="tab-quizzes"></section>
    <section class="view" id="view-progress" role="tabpanel" aria-labelledby="tab-progress" hidden></section>
    <section class="view" id="view-glossary" role="tabpanel" aria-labelledby="tab-glossary" hidden></section>
    <section class="view" id="view-ladder" role="tabpanel" aria-labelledby="tab-ladder" hidden></section>
  </main>
</div>

<script id="podcast-data" type="application/json">"__DISTRESSED_DATA__"</script>
<script>
(function () {
  "use strict";

  // ---- Data ---------------------------------------------------------------
  var raw = document.getElementById("podcast-data").textContent;
  var DATA;
  try { DATA = JSON.parse(raw); } catch (e) { DATA = null; }
  var BUILT = DATA && typeof DATA === "object" && Array.isArray(DATA.episodes);
  var LEDGER = BUILT ? DATA.ledger.concepts : [];
  var EPISODES = BUILT ? DATA.episodes : [];
  var CONCEPT_BY_ID = {};
  LEDGER.forEach(function (c) { CONCEPT_BY_ID[c.id] = c; });

  var TIER_LABEL = {
    accounting: "Accounting", capital_structure: "Capital structure", legal: "Legal",
    process: "Process", valuation: "Valuation", trading: "Trading"
  };
  var STATUS_LABEL = { introduced: "Introduced", mastered: "Mastered", needs_reteach: "Re-teach" };
  var STATUS_CLASS = { introduced: "", mastered: "good", needs_reteach: "bad" };

  var LADDER = [
    { name: "Super-senior: DIP loans and the ABL", kind: "debt",
      what: "The first dollars out. A DIP loan is new money lent to a company already in Chapter 11 with a court-ordered claim ahead of everyone. An ABL is a revolver whose availability is a slice of inventory and receivables, so it sits on the most liquid collateral.",
      paid: "Cash interest, usually floating; repaid first from its own collateral, and often rolled into the exit financing.",
      breaks: "Almost never impaired; if it is, the company is worth less than its working capital." },
    { name: "First-lien secured: term loans and secured notes", kind: "debt",
      what: "Debt with a first claim on specific collateral (plants, ships, brands, stock of subsidiaries). Whether it is a bank loan or a bond changes the documents, not the rung.",
      paid: "Cash interest; principal at maturity. In a restructuring: from collateral value first, and any shortfall becomes an unsecured deficiency claim.",
      breaks: "When enterprise value falls below the first-lien debt, this is the fulcrum and ends up owning the company." },
    { name: "Second-lien secured", kind: "debt",
      what: "Same collateral, second in line. The intercreditor agreement says how far it must stand back (payment blockage, standstill, who controls the collateral).",
      paid: "Higher coupon for the lower rung; often PIK toggles appear here first.",
      breaks: "Often the fulcrum in a moderate downturn; often 'primed' by new super-senior money." },
    { name: "Senior unsecured: bonds, trade, leases, litigation", kind: "debt",
      what: "No collateral, just a promise from the issuing entity plus any guarantees. Vendors, landlords whose leases are rejected, and lawsuit plaintiffs sit here too, sharing pro rata.",
      paid: "Fixed coupon; repaid from whatever value is left after secured claims are covered. Recoveries are quoted in cents on the dollar.",
      breaks: "The classic fulcrum in a full-blown Chapter 11; the committee (UCC) represents this class." },
    { name: "Subordinated debt", kind: "debt",
      what: "Debt that has agreed by contract to be paid after the senior unsecured. Structural subordination is the cousin: a claim at the parent is behind every claim at the subsidiary that owns the assets.",
      paid: "Highest coupon of the debt rungs; often PIK.",
      breaks: "Usually wiped out or handed a sliver of equity and warrants." },
    { name: "Preferred stock", kind: "equity",
      what: "Equity, not debt. No maturity, no default if the dividend is skipped (it accrues or PIKs), but a liquidation preference that must be paid before the common gets anything. Convertible preferred can turn into a large share of the common on a date or a trigger.",
      paid: "Dividends (cash or PIK) and the preference amount; sits below every creditor on the ladder.",
      breaks: "Lenders often take 'take-back preferred' in a plan when they want an equity-like claim that still ranks ahead of the old shareholders." },
    { name: "Common equity", kind: "equity",
      what: "The residual owner: whatever is left after every rung above is paid in full. Absolute priority says the common gets nothing unless every class above is paid or consents.",
      paid: "Dividends and the upside; in a restructuring, typically diluted to a few percent, warrants, or zero.",
      breaks: "First to lose everything; the 'left in the dust' rung in a trader's recap." }
  ];

  // ---- Store: db capability with a localStorage mirror -------------------
  var LS_KEY = "distressed-explainers.attempts.v1";
  var db = null;
  var attempts = [];
  var listeners = [];

  function lsRead() {
    try { var v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : []; } catch (e) { return []; }
  }
  function lsWrite(list) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) { /* private window etc. */ }
  }
  function setAttempts(list) {
    attempts = list.slice().sort(function (a, b) { return (a.finished_at < b.finished_at) ? 1 : -1; });
    listeners.forEach(function (fn) { fn(); });
  }
  function onAttempts(fn) { listeners.push(fn); }

  function setSync(on, text) {
    var el = document.getElementById("sync-status");
    el.classList.toggle("on", on);
    document.getElementById("sync-text").textContent = text;
  }

  attempts = lsRead();

  function saveAttempt(attempt) {
    var next = attempts.concat([attempt]);
    lsWrite(next);
    setAttempts(next);
    if (!db) return Promise.resolve(false);
    return db.collection("attempts").doc(attempt.id).set(attempt).then(function () {
      return true;
    }).catch(function (err) {
      setSync(false, "Saved locally only (" + (err && err.code ? err.code : "error") + ")");
      return false;
    });
  }

  function connectDb() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then(function (ns) {
      if (!ns) return;
      db = ns;
      setSync(true, "Synced to your Claude account");
      db.collection("attempts").orderBy("finished_at", "desc").limit(500).onSnapshot(function (snap) {
        var remote = snap.docs.map(function (d) { return d.data(); });
        var local = lsRead();
        var byId = {};
        remote.concat(local).forEach(function (a) { if (a && a.id) byId[a.id] = a; });
        var merged = Object.keys(byId).map(function (k) { return byId[k]; });
        // Push any local-only attempts up, one at a time.
        var remoteIds = {};
        remote.forEach(function (a) { remoteIds[a.id] = true; });
        var pending = local.filter(function (a) { return a && a.id && !remoteIds[a.id]; });
        pending.reduce(function (p, a) {
          return p.then(function () { return db.collection("attempts").doc(a.id).set(a).catch(function () {}); });
        }, Promise.resolve());
        lsWrite(merged);
        setAttempts(merged);
      }, function (err) {
        setSync(false, "Saving locally (" + (err && err.code ? err.code : "sync lost") + ")");
      });
    });
  }

  // ---- Derived progress ---------------------------------------------------
  function conceptState() {
    // Latest quiz result per concept, newest attempt first.
    var state = {};
    LEDGER.forEach(function (c) { state[c.id] = { concept: c, status: c.status, tested: 0, missed: 0, last: null }; });
    attempts.slice().reverse().forEach(function (a) {
      (a.answers || []).forEach(function (ans) {
        (ans.concept_ids || []).forEach(function (cid) {
          if (!state[cid]) return;
          state[cid].tested += 1;
          if (!ans.correct) state[cid].missed += 1;
          state[cid].last = ans.correct ? "correct" : "wrong";
          state[cid].status = ans.correct ? "mastered" : "needs_reteach";
        });
      });
    });
    return state;
  }

  function bestFor(slug) {
    var best = null;
    attempts.forEach(function (a) {
      if (a.slug !== slug) return;
      if (!best || a.score > best.score) best = a;
    });
    return best;
  }
  function countFor(slug) { return attempts.filter(function (a) { return a.slug === slug; }).length; }

  // ---- Utilities ----------------------------------------------------------
  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k === "html") el.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === false || attrs[k] == null) { /* skip */ }
      else el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function levelDots(n) {
    var el = h("span", { class: "level", title: "Level " + n + " of 5", "aria-label": "Level " + n + " of 5" });
    for (var i = 1; i <= 5; i++) el.appendChild(h("i", { class: i <= n ? "on" : "" }));
    return el;
  }
  function pill(text, cls) { return h("span", { class: "pill " + (cls || ""), text: text }); }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function normalize(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9%$.]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function seededShuffle(list, seed) {
    var a = list.slice();
    var x = 0;
    for (var i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) >>> 0;
    function rnd() { x = (x * 1664525 + 1013904223) >>> 0; return x / 4294967296; }
    for (var j = a.length - 1; j > 0; j--) {
      var k = Math.floor(rnd() * (j + 1));
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    var same = a.every(function (v, idx) { return v === list[idx]; });
    if (same && a.length > 1) { a.push(a.shift()); }
    return a;
  }
  function conceptNames(ids) {
    return ids.map(function (id) { return CONCEPT_BY_ID[id] ? CONCEPT_BY_ID[id].name : id; }).join(", ");
  }

  // ---- Views --------------------------------------------------------------
  var views = {
    quizzes: document.getElementById("view-quizzes"),
    progress: document.getElementById("view-progress"),
    glossary: document.getElementById("view-glossary"),

  function renderQuestion() {
    var root = views.quizzes;

    function check() {
      var result = control.grade();
      if (result === null || result.error) {
        clear(feedback);
        feedback.hidden = false;
        feedback.className = "feedback";
        feedback.appendChild(h("p", { class: "small", text: result && result.error ? result.error : "Answer first, then check." }));
        var focusable = control.el.querySelector("input,select");
        if (focusable) focusable.focus();

      run.answers.push({
        q: q.id, type: q.type, level: q.level, retest: !!q.retest,
        concept_ids: q.concept_ids.slice(), correct: result.correct, given: result.given

  function buildControl(q) {
    var el, grade, reveal;
    if (q.type === "multiple_choice") {
      var name = "mc-" + q.id;

        return { row: row, input: input };
      });
      rows.forEach(function (r) { el.appendChild(r.row); });
      grade = function () {
        var picked = rows.findIndex(function (r) { return r.input.checked; });
        if (picked < 0) return null;
        return { correct: picked === q.answer, given: picked, answerText: "The answer is " + "ABCDE"[q.answer] + ": " + q.choices[q.answer] };
      };
      reveal = function (result) {
        rows.forEach(function (r, i) {
          r.input.disabled = true;
          if (i === q.answer) r.row.classList.add("correct");

      grade = function () {
        if (num.value.trim() === "") return null;
        var v = parseFloat(num.value);

        var ok = Math.abs(v - q.answer) <= q.tolerance + 1e-9;
        return { correct: ok, given: v, answerText: "The answer is about " + q.answer + " " + q.unit + (q.tolerance ? " (within " + q.tolerance + ")" : "") + "." };
      };

      grade = function () {

        var ok = q.accepted.some(function (a) { return normalize(a) === n; });
        return { correct: ok, given: given, answerText: "We were looking for: " + q.accepted[0] + "." };
      };
      reveal = function () { txt.disabled = true; };
    } else {
      var shuffled = seededShuffle(q.items, q.id + ":" + run.ep.slug);
      el = h("div", { class: "order-list", "aria-label": "Put in order: 1 is first" });
      var selects = shuffled.map(function (item) {
        var sel = h("select", { "aria-label": "Position of " + item, id: "ord-" + q.id + "-" + q.items.indexOf(item) });
        sel.appendChild(h("option", { value: "", text: "—" }));
        q.items.forEach(function (_, i) { sel.appendChild(h("option", { value: String(i + 1), text: String(i + 1) })); });
        var row = h("div", { class: "order-item" }, [sel, h("span", { text: item })]);
        el.appendChild(row);
        return { item: item, sel: sel, row: row };
      });
      grade = function () {
        var positions = selects.map(function (s) { return s.sel.value; });
        if (positions.some(function (p) { return !p; })) return null;
        if (new Set(positions).size !== positions.length) return { error: "Each position can only be used once." };
        var correct = selects.every(function (s) { return Number(s.sel.value) === q.items.indexOf(s.item) + 1; });
        var given = selects.slice().sort(function (a, b) { return Number(a.sel.value) - Number(b.sel.value); }).map(function (s) { return s.item; });

      };

  }

        h("div", { class: "rail" }, [h("i")]),
        h("div", {}, [
          h("div", { class: "row between" }, [h("h3", { text: r.name }), pill(r.kind === "debt" ? "Creditor" : "Equity", r.kind === "debt" ? "accent" : "warn")]),
          h("dl", {}, [
            h("dt", { text: "What it is" }), h("dd", { text: r.what }),
            h("dt", { text: "How it gets paid" }), h("dd", { text: r.paid }),
            h("dt", { text: "When it breaks" }), h("dd", { text: r.breaks })
          ])
        ])
      ]));
    });
    root.appendChild(ladder);
    root.appendChild(h("div", { class: "card stack small muted" }, [
      h("h3", { style: "color:var(--ink)", text: "Two things that move a claim between rungs" }),
      h("p", { text: "A guarantee from another entity pulls a claim up: the lender can also collect from the guarantor. Structural subordination pushes a claim down: a bond at the holding company is paid only from what is left after the operating subsidiary's own creditors are done, because the subsidiary's assets belong to the subsidiary." }),
      h("p", { text: "This ladder is general education, not a description of any one company. Each episode's research says where its instruments actually sit." })
    ]));
  };

  // ---- Boot ---------------------------------------------------------------
  onAttempts(function () { if (current !== "quizzes" || listShown) render[current](); });
  var remembered = null;
  try { remembered = localStorage.getItem("distressed-explainers.tab"); } catch (e) { /* ignore */ }
  show(remembered && views[remembered] ? remembered : "quizzes");
  connectDb();
})();
</script>
